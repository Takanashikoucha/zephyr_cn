# 中文文档自动构建与部署
# 触发：main 分支 push 时自动构建 Sphinx HTML + 指南 HTML，部署到 GitHub Pages
name: CN Docs Deploy

on:
  push:
    branches: [main]
    paths:
      - 'docs_cn/**'
      - 'guide/**'
      - 'scripts/build_guide.py'
      - '.github/workflows/cn-docs-deploy.yml'

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r docs_cn/requirements.txt
          pip install markdown

      - name: Build Sphinx HTML
        run: |
          cd docs_cn
          python -m sphinx -b html . _build/html

      - name: Build guide HTML
        run: |
          python scripts/build_guide.py

      - name: Build Luminous static site
        run: |
          python scripts/build_luminous.py

      - name: Assemble public directory
        run: |
          mkdir -p public
          if [ -d docs_cn/build_luminous ]; then
            cp -r docs_cn/build_luminous/* public/
          else
            cp -r docs_cn/_build/html/* public/
          fi
          if [ -d public/guide ]; then
            rm -rf public/guide
          fi
          mkdir -p public/guide
          cp -r guide_html/* public/guide/
          cat > public/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="zh-CN">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Zephyr 中文文档</title>
            <style>
              :root {
                --night1: #05070b; --night2: #081018;
                --bone: #7cc4ff; --bone2: #a9dcff; --bone-dim: rgba(124,196,255,.30);
                --thread: #5eead4; --red: #ff4d63; --purple: #c9a3ff;
                --txt: #e6eef6; --sub: #93a6bd; --dim: #5f7288;
                --line: rgba(124,196,255,.20); --panel: rgba(4,9,16,.82);
              }
              body {
                font-family: 'JetBrains Mono', 'Sarasa Mono SC', 'Noto Sans Mono CJK SC', monospace;
                background: var(--night1); color: var(--sub);
                font-size: 14px; line-height: 1.6; margin: 0; min-height: 100vh;
                display: flex; flex-direction: column; align-items: center; justify-content: center;
              }
              h1 { color: var(--txt); font-weight: 800; letter-spacing: 3px; margin: 0 0 8px;
                   text-shadow: 0 2px 10px rgba(8,16,28,.95), 0 0 22px rgba(124,196,255,.6); }
              .subtitle { color: var(--dim); font-size: 12px; letter-spacing: 2px; margin-bottom: 40px; }
              .cards { display: flex; gap: 24px; flex-wrap: wrap; justify-content: center; }
              .card {
                display: block; width: 280px; padding: 28px 24px;
                background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
                text-decoration: none; transition: all .25s;
                box-shadow: 0 0 20px rgba(0,0,0,.4), inset 0 0 20px rgba(0,0,0,.3);
              }
              .card:hover {
                border-color: var(--bone); transform: translateY(-4px);
                box-shadow: 0 0 30px rgba(124,196,255,.25), inset 0 0 20px rgba(0,0,0,.3);
              }
              .card h2 { color: var(--bone2); font-size: 18px; font-weight: 800; letter-spacing: 2px;
                         margin: 0 0 10px; filter: drop-shadow(0 0 8px rgba(124,196,255,.3)); }
              .card p { color: var(--sub); font-size: 13px; margin: 0; }
              .card .arrow { color: var(--thread); font-size: 20px; margin-top: 14px; }
            </style>
          </head>
          <body>
            <h1>Zephyr 中文文档</h1>
            <p class="subtitle">Zephyr RTOS 中文技术文档与源码导读</p>
            <div class="cards">
              <a class="card" href="/introduction/index.html">
                <h2>技术文档</h2>
                <p>系统化的 Zephyr RTOS 中文技术文档，涵盖内核、驱动、构建、安全等全部章节。</p>
                <div class="arrow">→</div>
              </a>
              <a class="card" href="/guide/index.html">
                <h2>源码阅读指南</h2>
                <p>结构化的源码导读路径，从整体架构到关键子系统，7 个章节逐步深入。</p>
                <div class="arrow">→</div>
              </a>
            </div>
          </body>
          </html>
          EOF

      - name: Deploy to gh-pages branch
        run: |
          git checkout --orphan gh-pages-deploy
          git rm -rf . >/dev/null 2>&1 || true
          cp -r public/* .
          git add -A
          git -c user.name="KouchaBot" -c user.email="kouchabot@proton.me" commit -m "pages: deploy from ${GITHUB_SHA}"
          git push --force origin HEAD:gh-pages
