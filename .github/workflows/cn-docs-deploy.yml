# Zephyr 中文文档构建与 GitHub Pages 部署
# 构建 Sphinx 中文文档 + 渲染源码阅读指南，部署到 Pages
name: CN Docs Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: docs_cn/requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r docs_cn/requirements.txt

      - name: Build Sphinx docs
        run: |
          cd docs_cn
          sphinx-build -b html . _build/html
          echo "Sphinx build completed"

      - name: Build guide (Markdown to HTML)
        run: |
          # 用 Python 脚本将 Markdown 指南转为 HTML
          pip install markdown
          python3 scripts/build_guide.py

      - name: Assemble public directory
        run: |
          mkdir -p public
          # 复制 Sphinx 构建产物
          cp -r docs_cn/_build/html/* public/
          # 复制指南 HTML
          cp -r guide_html/* public/guide/ 2>/dev/null || true
          # 创建首页重定向
          cat > public/index.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <meta http-equiv="refresh" content="0; url=/docs_cn/">
            <title>Zephyr 中文文档</title>
          </head>
          <body>
            <p>正在跳转到 <a href="/docs_cn/">Zephyr 中文文档</a>...</p>
          </body>
          </html>
          EOF

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
